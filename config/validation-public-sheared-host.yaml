# Config for the emseq validation wrapper: host pass on the public sheared NA12878 DNA runs (PRJNA591788).
# Tangled from emseq.org; do not edit directly.
# Run on jeff-ubuntu8 from ~/repos/emseq:
#   snakemake -s workflows/validation.smk --configfile config/validation-public-sheared-host.yaml --use-conda

available-concurrency: 64
main-data-dir: /mnt/data/projects/emseq-validation-public/host

envs:
  emseq: ~/repos/emseq/config/emseq-conda-env.yaml
  methylkit: ~/repos/emseq/config/methylkit-conda-env.yaml
repos:
  emseq: ~/repos/emseq

# A seeded 30 M-pair subsample of each run (seqtk sample -s 20261123)
library-ids:
  - SRR10532144_s30m
  - SRR10532145_s30m

keep-bed: /mnt/data/projects/emseq-validation-public/inputs/hg38_autosomes.bed
exclude-bed: /mnt/data/projects/emseq-validation-public/inputs/hg38-blacklist.v2.sorted.bed.gz

emseq_ref_assemblies:
  ncbi_decoy_hg38:
    name: ncbi_decoy_hg38
    input: GCA_000001405.15_GRCh38_no_alt_plus_hs38d1_analysis_set.fa.gz
  unmeth_lambda:
    name: unmeth_lambda
    input: Lambda_NEB.fa.gz
  puc19:
    name: puc19
    input: pUC19.fa.gz

validation-dataset: public-sheared-host
validation-host-ref: ncbi_decoy_hg38
validation-fragment-end-sources: [host]
validation-compare-settings: true
validation-library-index:
  SRR10532144_s30m: 1
  SRR10532145_s30m: 2
